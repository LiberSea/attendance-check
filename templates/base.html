{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}대학교 출석체크 시스템{% endblock %}</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<nav>
  <a class="brand" href="{% url 'home' %}">출석체크 시스템</a>
  <div class="spacer"></div>
  {% if user.is_authenticated %}
    <span class="user-chip">{{ user.username }}님 · {{ user.get_role_display }}</span>
    <a href="{% url 'accounts:dashboard' %}">대시보드</a>
    <form action="{% url 'logout' %}" method="post">
      {% csrf_token %}
      <button type="submit" class="link-btn">로그아웃</button>
    </form>
  {% else %}
    <a href="{% url 'login' %}">로그인</a>
    <a href="{% url 'accounts:signup' %}">회원가입</a>
  {% endif %}
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
