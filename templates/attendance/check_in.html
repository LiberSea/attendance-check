{% extends "base.html" %}
{% block title %}출석 체크{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ course.name }} 출석 체크</h1>
  <p>교수님께 안내받은 출석 코드를 입력하세요.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">체크인</button>
  </form>
</div>
{% endblock %}
