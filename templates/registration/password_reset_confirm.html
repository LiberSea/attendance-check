{% extends "base.html" %}
{% block title %}새 비밀번호 설정{% endblock %}
{% block content %}
<div class="card">
  <h1>새 비밀번호 설정</h1>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">비밀번호 변경</button>
    </form>
  {% else %}
    <p>비밀번호 재설정 링크가 유효하지 않거나 만료되었습니다. 다시 요청해주세요.</p>
    <p><a href="{% url 'password_reset' %}">비밀번호 찾기로 돌아가기</a></p>
  {% endif %}
</div>
{% endblock %}
