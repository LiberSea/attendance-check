{% extends "base.html" %}
{% block title %}비밀번호 찾기{% endblock %}
{% block content %}
<div class="card">
  <h1>비밀번호 찾기</h1>
  <p>가입 시 등록한 이메일 주소를 입력하면 비밀번호 재설정 링크를 보내드립니다.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">재설정 링크 보내기</button>
  </form>
</div>
{% endblock %}
